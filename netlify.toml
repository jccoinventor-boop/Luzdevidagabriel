[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  # SUPABASE_URL identifica el endpoint público del proyecto; no contiene una
  # credencial. Se excluye sólo esa variable para conservar activo el escaneo
  # de claves administrativas y demás secretos.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL"

# Valores públicos y URL de servidor aislados para Pull Requests. Las claves
# administrativas nunca se guardan aquí; sin una clave de staging válida, las
# funciones auxiliares fallan cerradas en vez de escribir en producción.
[context.deploy-preview.environment]
  PUBLIC_SUPABASE_URL = "https://kxlrtuqjclsvgchawzfe.supabase.co"
  PUBLIC_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_euxQSsquRBN86KmDNFCRzw_WVmBqfqp"
  SUPABASE_URL = "https://kxlrtuqjclsvgchawzfe.supabase.co"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self' https://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self' https://wa.me; frame-ancestors 'none'; upgrade-insecure-requests;"

[[headers]]
  for = "/release.json"
  [headers.values]
    Cache-Control = "no-store"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/webhooks/whatsapp"
  to = "/.netlify/functions/whatsapp"
  status = 200
